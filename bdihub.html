<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>nejsk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* ===== CDN MP4 PLAYER ===== */

.video-wrapper{
  position:relative;
  width:100%;
  max-width:100vw;
  height:100vh;
  background:#000;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== VIDEO ===== */

video{
  display:block;
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

/* ===== CONTINUE OVERLAY ===== */

.continue-overlay{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.45);
  z-index:20;
}

.continue-box{
  width:320px;
  max-width:85%;
  background:#111;
  border-radius:3px;
  padding:22px 18px 18px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,0.5);
}

.continue-box h2{
  color:#fff;
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
}

.continue-box p{
  color:#aaa;
  font-size:14px;
  line-height:1.4;
  margin-bottom:18px;
}

.continue-btn{
  width:220px;
  max-width:100%;
  height:39px;
  border:0;
  border-radius:4px;
  background:#2864e6;
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:background .2s ease, transform .1s ease;
}

.continue-btn:hover{
  background:#1f56ca;
}

.continue-btn:active{
  transform:scale(.98);
}

/* ===== MOBILE ===== */

@media (max-width:600px){

  body{
    background:#000;
  }

  .video-wrapper{
    width:100vw;
    height:100vh;
    max-width:none;
    border-radius:0;
  }

  video{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .continue-box{
    width:320px;
    max-width:88%;
    padding:20px 16px 16px;
  }

  .continue-box h2{
    font-size:18px;
  }

  .continue-box p{
    font-size:13px;
  }

  .continue-btn{
    width:220px;
    height:40px;
  }
}

/* ===== DESKTOP ===== */

@media (min-width:601px){

  .video-wrapper{
    width:100vw;
    height:100vh;
  }

}
</style>
</head>

<body oncontextmenu="return false">

<div class="video-wrapper">

  <video id="video"
    autoplay
    muted
    playsinline
    controls
    controlsList="nodownload noplaybackrate">
  </video>

  <!-- CONTINUE WATCHING -->
  <div class="continue-overlay" id="continueOverlay">

    <div class="continue-box">

      <h2>Continue watching?</h2>

      <p>Press continue to keep watching the video.</p>

      <button class="continue-btn" id="continueBtn">
        Continue Watching
      </button>

    </div>

  </div>

</div>

<script>

const video = document.getElementById("video");
const continueOverlay = document.getElementById("continueOverlay");
const continueBtn = document.getElementById("continueBtn");

// ===============================
// AMBIL ?id=
// ===============================

const params = new URLSearchParams(window.location.search);
const VIDEO_ID = params.get("id");


// ===============================
// LOAD VIDEO
// ===============================

if(VIDEO_ID){

  let base = "https://cdn.baddiehub.com/" + VIDEO_ID;

  function loadVideo(src){

    video.src = src;
    video.load();

  }

  // Coba MP4 terlebih dahulu
  loadVideo(base + ".mp4");


  // Jika MP4 gagal, coba MOV
  video.onerror = () => {

    if(!video.dataset.mov){

      video.dataset.mov = "1";

      loadVideo(base + ".mov");

    }

  };


}else{

  document.querySelector(".video-wrapper").innerHTML =
    "<div style='color:#fff;font-size:18px;font-family:Arial;text-align:center;'>Video not found</div>";

}


// ===============================
// CONTINUE SETTING
// ===============================

let continueShown = false;


// ===============================
// CEK VIDEO SUDAH 5 DETIK
// ===============================

video.addEventListener("timeupdate", function(){

  if(
    !continueShown &&
    video.currentTime >= 5
  ){

    continueShown = true;

    // Pause video
    video.pause();

    // Tampilkan overlay
    continueOverlay.style.display = "flex";

  }

});


// ===============================
// TOMBOL CONTINUE
// ===============================

continueBtn.addEventListener("click", function(){

  // Hilangkan overlay
  continueOverlay.style.display = "none";

  // Lanjutkan video
  video.play().catch(function(error){

    console.log("Video play error:", error);

  });

});

</script>
